name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Pages demo
        run: pnpm run build:pages

      - name: Verify the Pages artifact rejects .map, .env, .npmrc, and dotfiles
        run: pnpm run verify:pages-artifact

      - name: Upload the exact demo distribution
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/demo/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  smoke:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Chromium browser only
        run: pnpm exec playwright install chromium

      - name: Smoke test the deployed Pages URL
        id: smoke
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: pnpm run test:pages-smoke

      - name: Preserve failed smoke evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-smoke-evidence
          path: test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Write deployment summary
        if: always()
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: |
          summary_file="$GITHUB_STEP_SUMMARY"
          {
            echo "## GitHub Pages deployment"
            echo "- page_url: ${PAGE_URL:-unavailable}"
            echo "- commit: ${{ github.sha }}"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- smoke: ${SMOKE_RESULT:-not-run}"
          } >> "$summary_file"
